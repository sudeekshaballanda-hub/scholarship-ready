<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – ScholarshipReady</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🎓 ScholarshipReady</a>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="#" class="btn-trust">🔒 No OTP Required</a>
      </nav>
    </div>
  </header>

  <main class="container auth-main">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active">Log In</button>
        <button id="tabSignup" class="auth-tab">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <h2>Welcome back</h2>
        <p class="auth-sub">Log in to check your document readiness.</p>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@example.com" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-primary">Log In</button>
        <p id="loginError" class="error-msg" hidden></p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form" hidden>
        <h2>Create an account</h2>
        <p class="auth-sub">Save your document progress and get matched.</p>
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="signupName" required placeholder="Your name" />
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="signupEmail" required placeholder="you@example.com" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signupPassword" required placeholder="Create a password" />
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
        <p id="signupError" class="error-msg" hidden></p>
      </form>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
