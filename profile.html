<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile – ScholarshipReady</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🎓 ScholarshipReady</a>
      <nav class="nav" id="navLinks">
        <a href="index.html">Dashboard</a>
        <a href="profile.html" class="active">My Profile</a>
        <a href="#" class="btn-trust" id="logoutBtn" style="background:#fee2e2; color:#b91c1c;">Log Out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- SECTION 1: Personal Details -->
    <div class="profile-section">
      <h1 id="greeting">Loading...</h1>
      <p class="sub">Fill out your details so we can match you with the right scholarships.</p>

      <form id="profileForm">
        <div class="input-group">
          <label>Education Level</label>
          <select id="profLevel" required>
            <option value="">Select your current level</option>
            <option value="Class 9">Class 9</option>
            <option value="Class 10">Class 10</option>
            <option value="Class 11">Class 11</option>
            <option value="Class 12">Class 12</option>
            <option value="UG">Undergraduate (UG)</option>
            <option value="PG">Postgraduate (PG)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label>Category</label>
            <select id="profCategory" required>
              <option value="">Select Category</option>
              <option value="General">General</option>
              <option value="OBC">OBC</option>
              <option value="SC">SC</option>
              <option value="ST">ST</option>
              <option value="EWS">EWS</option>
              <option value="Minority">Minority</option>
            </select>
          </div>
          <div class="input-group">
            <label>Annual Family Income (₹)</label>
            <input type="number" id="profIncome" required placeholder="e.g. 250000" />
          </div>
        </div>

        <button type="submit" class="btn-primary">Save Profile Details</button>
      </form>
    </div>

    <!-- SECTION 2: Document Vault -->
    <div class="profile-section" style="margin-top: 30px;">
      <h2>📁 My Document Vault</h2>
      <p class="sub">Upload these documents once. We will securely check them against the requirements of any scholarship you want to apply for.</p>
      
      <div id="vaultList" class="vault-grid">
        <!-- JS will inject the document upload boxes here -->
      </div>
    </div>
  </main>

  <script src="js/profile.js"></script>
</body>
</html>
